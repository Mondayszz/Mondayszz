name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs automatically every day
  workflow_dispatch:       # can be run manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23e60012&color_dots=%23ebedf0,%23a3c4ff,%234d8dff,%231f5fd6,%230b2f8a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ffd400&color_dots=%23161b22,%230b2f8a,%231f5fd6,%234d8dff,%23a3c4ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
